# Render Blueprint for the Student AI Chatbot
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys the app as a Node Web Service (not a Static Site).
# Free plan. Auto-deploys on every git push.

services:
  - type: web
    name: student-ai-chatbot
    runtime: node
    plan: free
    region: oregon           # change if you prefer (frankfurt, singapore, ohio, virginia)
    branch: main             # change if your default branch has a different name
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.1
