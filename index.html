<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#121318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Study Buddy - Student AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Puter.js: free, keyless access to GPT-5, GPT-4o, Claude, Gemini, DeepSeek, Llama, etc. -->
  <script src="https://js.puter.com/v2/"></script>

  <!-- Markdown + sanitize + code highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Study Buddy</h2>
      <button id="newChatBtn" class="new-chat-btn" title="New chat">+ New Chat</button>
    </div>

    <div class="sidebar-section">
      <label for="modelSelect">Model</label>
      <select id="modelSelect">
        <optgroup label="OpenAI">
          <option value="gpt-5">GPT-5</option>
          <option value="gpt-5-mini">GPT-5 Mini (fast)</option>
          <option value="gpt-4o" selected>GPT-4o (vision)</option>
          <option value="gpt-4o-mini">GPT-4o Mini (vision)</option>
          <option value="o1">o1 (reasoning)</option>
          <option value="o3-mini">o3 Mini</option>
        </optgroup>
        <optgroup label="Anthropic">
          <option value="claude-sonnet-4-5">Claude Sonnet 4.5 (vision)</option>
          <option value="claude-opus-4">Claude Opus 4 (vision)</option>
          <option value="claude-3-7-sonnet">Claude 3.7 Sonnet (vision)</option>
        </optgroup>
        <optgroup label="Google">
          <option value="google/gemini-2.5-pro">Gemini 2.5 Pro (vision)</option>
          <option value="google/gemini-2.5-flash">Gemini 2.5 Flash (vision)</option>
        </optgroup>
        <optgroup label="DeepSeek">
          <option value="deepseek-chat">DeepSeek V3</option>
          <option value="deepseek-reasoner">DeepSeek R1</option>
        </optgroup>
        <optgroup label="Meta">
          <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
        </optgroup>
      </select>
    </div>

    <div class="sidebar-section">
      <label for="modeSelect">Study Mode</label>
      <select id="modeSelect">
        <option value="tutor" selected>Tutor (explain step by step)</option>
        <option value="homework">Homework Helper</option>
        <option value="writer">Essay & Writing Coach</option>
        <option value="math">Math & Science</option>
        <option value="code">Coding Helper</option>
        <option value="quiz">Quiz Me</option>
        <option value="summary">Summarize & Notes</option>
        <option value="free">Free Chat</option>
      </select>
    </div>

    <div class="sidebar-section">
      <label>Options</label>
      <label class="checkbox-row">
        <input type="checkbox" id="ttsToggle" />
        <span>Read replies aloud</span>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="autoSendVoice" checked />
        <span>Auto-send voice input</span>
      </label>
    </div>

    <div class="sidebar-section chats-section">
      <label>Chat History</label>
      <ul id="chatList" class="chat-list"></ul>
    </div>

    <div class="sidebar-footer">
      <button id="exportBtn" class="ghost-btn" title="Export current chat as Markdown">Export Chat</button>
      <button id="clearAllBtn" class="danger-btn" title="Delete all chats">Clear All</button>
      <p class="footer-note">Powered by Puter.js &mdash; no API key needed</p>
    </div>
  </aside>

  <!-- Dark backdrop when sidebar is open (mobile) -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main">
    <header class="topbar">
      <button id="toggleSidebar" class="icon-btn" title="Toggle sidebar">&#9776;</button>
      <h1 id="chatTitle">New Chat</h1>
      <button id="stopSpeakBtn" class="icon-btn" title="Stop speaking" hidden>&#9632;</button>
      <button id="themeBtn" class="icon-btn" title="Toggle theme">&#9790;</button>
    </header>

    <section id="messages" class="messages">
      <div class="welcome">
        <h2>Hi! I'm your Student AI Assistant</h2>
        <p>Ask me anything &mdash; homework, essays, math, coding, science, or study tips. You can type, speak, or attach an image.</p>
        <div class="suggestions">
          <button class="suggestion">Explain photosynthesis like I'm 12</button>
          <button class="suggestion">Help me solve: 2x + 5 = 17</button>
          <button class="suggestion">Write a thesis statement about climate change</button>
          <button class="suggestion">Quiz me on World War II</button>
        </div>
      </div>
    </section>

    <form id="inputForm" class="input-area">
      <div class="input-wrap">
        <div id="attachedImages" class="attached-images" hidden></div>
        <textarea
          id="userInput"
          placeholder="Ask your study question... (Shift+Enter for new line)"
          rows="1"
          autocomplete="off"
        ></textarea>
        <div class="input-toolbar">
          <button type="button" id="attachBtn" class="tool-btn" title="Attach image">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input type="file" id="fileInput" accept="image/*" hidden multiple />
          <button type="button" id="micBtn" class="tool-btn" title="Voice input">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button type="submit" id="sendBtn" class="send-btn" title="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
