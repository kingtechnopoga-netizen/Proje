<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Puter.js gives free access to GPT-5, GPT-4o, Claude, Gemini, DeepSeek, Llama etc. with no API key -->
  <script src="https://js.puter.com/v2/"></script>
  <!-- Marked for markdown rendering, DOMPurify to sanitize, highlight.js for code -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Study Buddy</h2>
      <button id="newChatBtn" class="new-chat-btn" title="New chat">+ New Chat</button>
    </div>

    <div class="sidebar-section">
      <label for="modelSelect">Model</label>
      <select id="modelSelect">
        <optgroup label="OpenAI">
          <option value="gpt-5">GPT-5</option>
          <option value="gpt-5-mini">GPT-5 Mini (fast)</option>
          <option value="gpt-4o" selected>GPT-4o</option>
          <option value="gpt-4o-mini">GPT-4o Mini</option>
          <option value="o1">o1 (reasoning)</option>
          <option value="o3-mini">o3 Mini</option>
        </optgroup>
        <optgroup label="Anthropic">
          <option value="claude-sonnet-4-5">Claude Sonnet 4.5</option>
          <option value="claude-opus-4">Claude Opus 4</option>
          <option value="claude-3-7-sonnet">Claude 3.7 Sonnet</option>
        </optgroup>
        <optgroup label="Google">
          <option value="google/gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
        </optgroup>
        <optgroup label="DeepSeek">
          <option value="deepseek-chat">DeepSeek V3</option>
          <option value="deepseek-reasoner">DeepSeek R1</option>
        </optgroup>
        <optgroup label="Meta">
          <option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
        </optgroup>
      </select>
    </div>

    <div class="sidebar-section">
      <label for="modeSelect">Study Mode</label>
      <select id="modeSelect">
        <option value="tutor" selected>Tutor (explain step by step)</option>
        <option value="homework">Homework Helper</option>
        <option value="writer">Essay & Writing Coach</option>
        <option value="math">Math & Science</option>
        <option value="code">Coding Helper</option>
        <option value="quiz">Quiz Me</option>
        <option value="summary">Summarize & Notes</option>
        <option value="free">Free Chat</option>
      </select>
    </div>

    <div class="sidebar-section chats-section">
      <label>Chat History</label>
      <ul id="chatList" class="chat-list"></ul>
    </div>

    <div class="sidebar-footer">
      <button id="clearAllBtn" class="danger-btn" title="Delete all chats">Clear All</button>
      <p class="footer-note">Powered by Puter.js — no API key needed</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="toggleSidebar" class="icon-btn" title="Toggle sidebar">&#9776;</button>
      <h1 id="chatTitle">New Chat</h1>
      <button id="themeBtn" class="icon-btn" title="Toggle theme">&#9790;</button>
    </header>

    <section id="messages" class="messages">
      <div class="welcome">
        <h2>Hi! I'm your Student AI Assistant</h2>
        <p>Ask me anything — homework, essays, math, coding, science, or study tips.</p>
        <div class="suggestions">
          <button class="suggestion">Explain photosynthesis like I'm 12</button>
          <button class="suggestion">Help me solve: 2x + 5 = 17</button>
          <button class="suggestion">Write a thesis statement about climate change</button>
          <button class="suggestion">Quiz me on World War II</button>
        </div>
      </div>
    </section>

    <form id="inputForm" class="input-area">
      <textarea
        id="userInput"
        placeholder="Ask your study question... (Shift+Enter for new line)"
        rows="1"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="sendBtn" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
